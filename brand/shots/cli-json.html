<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>next-list json</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0b0e0a; }
    .window {
      width: 720px;
      margin: 40px auto;
      background: #10140f;
      border: 1px solid #2a3326;
      border-radius: 14px;
      overflow: hidden;
      font-family: "IBM Plex Mono", monospace;
      color: #ede6d2;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .bar { display:flex; align-items:center; gap:8px; padding:14px 16px; background:#161c14; border-bottom:1px solid #2a3326; color:#8a9080; font-size:12px; }
    .dot { width:10px; height:10px; border-radius:50%; }
    .r { background:#ff5c5c; } .y { background:#f5c542; } .g { background:#3ddc97; }
    pre { margin:0; padding:22px 24px 28px; font-size:13px; line-height:1.6; }
    .k { color:#67e8f9; } .n { color:#d6ff3f; } .s { color:#f5c542; } .dim { color:#8a9080; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span> npx next-list --json | jq .stats</div>
    <pre>{
  <span class="k">"pages"</span>: <span class="n">9</span>,
  <span class="k">"api"</span>: <span class="n">4</span>,
  <span class="k">"special"</span>: <span class="n">8</span>,
  <span class="k">"client"</span>: <span class="n">1</span>,
  <span class="k">"server"</span>: <span class="n">8</span>,
  <span class="k">"parallel"</span>: <span class="n">1</span>,
  <span class="k">"intercepting"</span>: <span class="n">1</span>,
  <span class="k">"methods"</span>: <span class="n">9</span>
}</pre>
  </div>
</body>
</html>
